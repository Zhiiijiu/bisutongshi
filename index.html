<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>通识选修学分计算系统</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><header><p class="eyebrow">GENERAL EDUCATION</p><h1>通识选修学分计算系统</h1><p class="intro">选择入学年级、搜索已修课程，自动检查通识选修要求。</p></header><section class="panel requirements"><div class="section-heading"><div><p class="eyebrow">1 · 选择入学年级</p><h2>对应培养方案</h2></div><button id="reset-button" class="text-button">清空已选课程</button></div><div class="grade-select"><label for="grade-input">入学年级</label><select id="grade-input"><option value="2023">2023 级</option><option value="2024">2024 级</option><option value="2025">2025 级及以后</option></select></div><div id="requirement-description" class="requirement-description"></div><div id="requirement-inputs" class="requirement-grid"></div></section><section class="panel"><div class="section-heading"><div><p class="eyebrow">2 · 选择课程</p><h2>课程搜索</h2></div><span id="course-count" class="pill"></span></div><div class="course-filters"><label class="search-wrap" for="search-input"><span>⌕</span><input id="search-input" type="search" placeholder="输入课程名称、课程号或模块名称"></label><select id="delivery-filter" aria-label="上课方式筛选"><option value="all">全部方式</option><option value="线上">线上</option><option value="线下">线下</option></select><select id="module-filter" aria-label="模块筛选"><option value="all">全部模块</option><option value="科学素养模块">科学素养</option><option value="政治素养模块">政治素养</option><option value="人文素养模块">人文素养</option><option value="法治素养模块">法治素养</option><option value="美育素养模块">美育素养</option><option value="综合素养模块">综合素养</option></select></div><div id="search-results" class="course-list"></div></section><section class="summary-section"><div class="section-heading"><div><p class="eyebrow">3 · 核对结果</p><h2>已修课程与学分进度</h2></div><strong id="overall-status" class="status"></strong></div><div id="mandatory-checks" class="mandatory-checks"></div><div id="module-cards" class="module-grid"></div></section></main><template id="course-template"><article class="course-row"><label><input type="checkbox"><span class="course-name"></span><small class="course-code"></small><small class="course-teachers"></small></label><span class="course-delivery"></span><span class="course-module"></span><b class="course-credit"></b></article></template><script src="catalog.js"></script><script src="app.js"></script></body></html>
